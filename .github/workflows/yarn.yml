name: LOTP - Yarn

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - ".github/workflows/yarn.yml"
      - ".yarnrc.yml"
      - "pwn.js"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: {'node-version': '20'}
      - run: corepack enable
        continue-on-error: true
      - uses: {'ref': '${{ github.event.pull_request.head.sha }}'}
      - run: yarn install
        continue-on-error: true
