name: LOTP - Cargo

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - ".github/workflows/cargo.yml"
      - "build.rs"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: None
      - uses: {'ref': '${{ github.event.pull_request.head.sha }}'}
      - run: cargo build
        continue-on-error: true
