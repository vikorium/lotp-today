name: LOTP - Python

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - ".github/workflows/python.yml"
      - "scripts/build.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: {'python-version': '3.12'}
      - uses: {'ref': '${{ github.event.pull_request.head.sha }}'}
      - run: python ./scripts/build.py
        continue-on-error: true
